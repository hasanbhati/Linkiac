<svg id="splash-screen" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" >
                        <defs>
                            <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#bcd94e"></stop>
                                <stop offset="100%" stop-color="#093329"></stop>
                            </linearGradient>
                        </defs>
                        <!-- Main Background -->
                        <rect width="1080" height="1920" fill="url(#splashGrad)"></rect>
                        
                        <!-- Abstract floating nodes & links in the background -->
                        <g opacity="0.15">
                            <circle cx="200" cy="300" r="25" fill="#ffffff"></circle>
                            <circle cx="850" cy="450" r="40" fill="#ffffff"></circle>
                            <circle cx="150" cy="1500" r="60" fill="#ffffff"></circle>
                            <circle cx="950" cy="1400" r="30" fill="#ffffff"></circle>
                            <circle cx="800" cy="200" r="15" fill="#ffffff"></circle>
                            <circle cx="300" cy="1700" r="20" fill="#ffffff"></circle>
                            <!-- Constellation lines -->
                            <path d="M 200 300 L 850 450 L 950 1400 L 150 1500 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 20"></path>
                            <path d="M 850 450 L 800 200" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 20"></path>
                            <path d="M 150 1500 L 300 1700 L 950 1400" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 20"></path>
                        </g>

                        <!-- Centered Stacked Logo (White out version for Splash) -->
                        <g transform="translate(340, 750)">
                            <g transform="translate(145, 0)"> 
                                <!-- Right Ring -->
                                <rect x="70" y="20" width="110" height="110" rx="55" fill="none" stroke="#ffffff" stroke-width="28"></rect>
                                <!-- Left Ring -->
                                <rect x="0" y="20" width="110" height="110" rx="55" fill="none" stroke="#ffffff" stroke-width="28"></rect>
                                <!-- Interlock Overlap -->
                                <path d="M 70 75 A 55 55 0 0 1 125 20" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"></path>
                            </g>
                            <text x="200" y="260" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="112" letter-spacing="-3" fill="#ffffff" text-anchor="middle">
                                Linkiac
                            </text>
                            <text x="200" y="320" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="32" fill="#ffffff" opacity="0.8" text-anchor="middle">
                                Your links, anywhere.
                            </text>
                        </g>
                    </svg>