# Railway Configuration for Linkiac Web App (Monorepo)
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @linkiac/web build"
watchPatterns = [
  "/apps/web/**",
  "/packages/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "turbo.json",
  "package.json"
]

[deploy]
startCommand = "pnpm --filter @linkiac/web start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
